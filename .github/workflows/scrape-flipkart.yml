name: Daily Flipkart Scraper

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Flipkart scraper
        run: python flipkart_scraper.py

      - name: Send email report
        if: always()
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          cp email_report.py email_flipkart.py
          sed -i 's/amazon_data.csv/flipkart_data.csv/g' email_flipkart.py
          sed -i 's/Amazon Scraper/Flipkart Scraper/g' email_flipkart.py
          sed -i 's/amazon_data_/flipkart_data_/g' email_flipkart.py
          python email_flipkart.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flipkart_data.csv
          git diff --cached --quiet || git commit -m "🛍️ Flipkart: $(TZ='Asia/Kolkata' date +'%d-%b-%Y %I:%M %p IST')"
          git push
